name: Release

# Changesets release flow (copied from the effect-web library, itself from
# the effect-jsonapi library): on every push to `trunk`, changesets/action
# either opens/updates the "Version Packages" PR (when unreleased changesets
# exist) or, when that PR has merged and no changesets remain, publishes every
# package to npmjs (OIDC trusted publishing — no token, no GitHub Packages)
# and tags the release.

on:
  push:
    branches: [trunk]

concurrency:
  group: release-${{ github.ref }}

# No permissions by default; the release job opts into exactly what it needs.
permissions: {}

jobs:
  release:
    name: Version or publish
    # Never run on forks (they have neither the environment nor the trusted
    # publisher binding, so a fork cannot publish on your behalf).
    if: github.repository == 'thomasfosterau/effect-payments'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Requires manual approval via a protected GitHub Environment named
    # "release". See PUBLISHING.md for the one-time setup.
    environment: release
    permissions:
      contents: write # push the version commit/tag and the "Version Packages" PR branch
      pull-requests: write # open/update the "Version Packages" PR
      id-token: write # OIDC: prove this workflow's identity to npm (no token needed)
    env:
      # pnpm 11 verifies dependencies before every `pnpm run` and, finding an
      # install made with --ignore-scripts, re-installs WITH scripts — running
      # the root `prepare` (and any allowed dependency build) inside this
      # id-token job. Turning the check off keeps the install below the only
      # one, and script-free.
      pnpm_config_verify_deps_before_run: "false"
    steps:
      - name: Checkout
        # The Changesets action pushes the version branch, so it needs the
        # checkout's git credentials (the ephemeral, job-scoped GITHUB_TOKEN).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Installs the pnpm version pinned by the package.json "packageManager"
      # field. Must run before setup-node so its pnpm cache can find the store.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # --ignore-scripts stops a compromised dependency from running install
      # scripts in the privileged publish job (the Shai-Hulud vector). It also
      # skips this workspace's own `prepare` (git hooks + the tsc/oxlint
      # patch), neither of which the `vp pack` build needs. It holds only
      # because `pnpm_config_verify_deps_before_run` is off for this job (see
      # `env` above): otherwise the first `pnpm run` re-installs with scripts.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # When changesets are pending, this opens/updates a "Version Packages" PR
      # (via `pnpm run version`). Once that PR is merged (no changesets remain),
      # it runs `pnpm run release`, which builds every package, publishes each
      # with `pnpm publish` and then `changeset tag`. pnpm 11 performs npm OIDC
      # trusted publishing itself (it mints the token; there is no NPM_TOKEN to
      # steal, and no npm CLI upgrade is needed), and `pnpm publish` is also
      # what rewrites the `catalog:` / `workspace:` specifiers into the ranges
      # consumers see. The action parses the "New tag:" output, pushes the tags
      # and creates the GitHub releases.
      #
      # No NPM_CONFIG_PROVENANCE: npm only issues provenance for PUBLIC source
      # repositories and rejects an explicit provenance request from a private
      # one. Trusted publishing attaches provenance on its own once the
      # repository is public.
      #
      # v2 of the action pairs with Changesets CLI v3 (`@changesets/cli` in
      # devDependencies) and renamed its inputs from v1's `version` / `publish`
      # / `commit` / `title`.
      - name: Create release PR or publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
