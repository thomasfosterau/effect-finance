# Dependabot version-update configuration (copied from the effect-web library,
# itself from the effect-drizzle-ext library and a subset of the gardeneria
# application's catalog).
#
# `groups` collect dependencies that MUST move together: the Effect 4 release
# line is a lockstep-versioned singleton set (moved with the consuming
# applications, and floated weekly by the Effect Canary workflow); the vitest
# toolchain is pinned to
# vite-plus's exact versions, so version updates to any of the three are
# ignored (they move together by hand, with the @effect/tsgo pin — see
# pnpm-workspace.yaml) while SECURITY updates stay enabled (the ignore is
# scoped to the `version-update:semver-*` update types; a bare
# `dependency-name` ignore would block security updates too).
#
# `cooldown` mirrors pnpm-workspace.yaml's `minimumReleaseAge`.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      effect:
        patterns:
          - "effect"
          - "@effect/*"
      vitest-toolchain:
        patterns:
          - "vitest"
          - "@vitest/coverage-istanbul"
          - "vite-plus"
    ignore:
      - dependency-name: "vite"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "vitest"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      # Pinned to vitest's exact version (vite-plus 0.3.x → vitest 4.1.11), so
      # it moves with the trio by hand.
      - dependency-name: "@vitest/coverage-istanbul"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      # The SDK's major versions change parameter and response types across
      # every resource module; it stays a required type source until the
      # remaining resource modules move to generated types (#81), so majors
      # wait for that.
      - dependency-name: "stripe"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite-plus"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
      include: "scope"
