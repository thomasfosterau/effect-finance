# Dependabot version-update configuration (copied from the effect-web library,
# itself from the effect-drizzle-ext library and a subset of the gardeneria
# application's catalog).
#
# `groups` collect dependencies that MUST move together: the Effect 4 release
# line is a lockstep-versioned singleton set (moved with the consuming
# applications); the vitest toolchain is pinned to vite-plus's exact versions.
# Version updates to the vitest toolchain are ignored (they move together by
# hand, with the @effect/tsgo pin — see pnpm-workspace.yaml).
#
# @effect/tsgo, `typescript` (the TS6 alias) and @typescript/native are also
# ignored for version updates: `effect-tsgo patch` matches the native `tsc`
# and vite-plus's `oxlint` by gitHead / version and fails `pnpm install` on
# any pairing it has no artifact for, so a PR that moves one of them alone
# goes red. The three move by hand as a set with vite-plus, after checking the
# `components` table in node_modules/@effect/tsgo/dist/effect-tsgo.cjs; the
# `effect` group excludes @effect/tsgo so its `@effect/*` pattern never pulls
# it in (#103).
#
# Every ignore is scoped to the `version-update:semver-*` update types, so
# SECURITY updates stay enabled; a bare `dependency-name` ignore would block
# them too.
#
# `cooldown` mirrors pnpm-workspace.yaml's `minimumReleaseAge`.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      effect:
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
      vitest-toolchain:
        patterns:
          - "vitest"
          - "@vitest/coverage-istanbul"
          - "vite-plus"
    ignore:
      - dependency-name: "@effect/tsgo"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "typescript"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "@typescript/native"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "vite"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      - dependency-name: "vitest"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      # Pinned to vitest's exact version (vite-plus 0.3.x → vitest 4.1.11), so
      # it moves with the trio by hand.
      - dependency-name: "@vitest/coverage-istanbul"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
      # The SDK is only an optional peer now: its types serve the SDK-based
      # `./Webhook` verifier (`constructEvent*`), and no module loads it
      # (#146). Its dev pin follows DISTILLED_API_VERSION (#160): a stripe-node
      # minor can move the SDK's API version, and a major also moves the published
      # peer range (`catalogs.peers`), so it moves by hand on a Distilled bump
      # (`tests/distilledApiVersion.test.ts` fails otherwise), never on its own.
      # Patches are still proposed: they are harmless, because
      # `tests/distilledApiVersion.test.ts` catches a patch that moves the API version.
      - dependency-name: "stripe"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "vite-plus"
        update-types:
          [
            "version-update:semver-major",
            "version-update:semver-minor",
            "version-update:semver-patch",
          ]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
      include: "scope"
