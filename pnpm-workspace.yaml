# pnpm workspace — the @thomasfosterau/effect-payments package family plus the
# dist-consumer check.
#
# The `catalog:` protocol pins versions that MUST be singletons across the
# workspace. Effect especially: two copies of `effect` break Context / Layer /
# Schema identity at runtime, so every package references `catalog:`.
#
# EVERY external dependency version lives here — package.json files reference
# only `catalog:` / `catalog:peers` / `catalog:peers-distilled` (or
# `workspace:` for internal packages).
# `catalogMode: strict` makes `pnpm add` enforce this at add time and
# `pnpm install` reject non-catalog specifiers. After editing this catalog,
# ALWAYS run `pnpm install` and commit the regenerated pnpm-lock.yaml — a stale
# lockfile fails CI at once with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
#
# The toolchain entries (vite-plus, the TypeScript 6/7 pair, @effect/tsgo,
# fallow, changesets) and the Effect pin are copied from the effect-web
# library, the newest sibling on the owner's Vite+ library standard, and kept
# in lockstep with the consuming applications' catalogs (effect 4.0.0).
packages:
  - packages/*
  - tests/*

catalogMode: strict

catalog:
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  # Distilled's Stripe client (alchemy-run/distilled, Apache-2.0): the
  # operations, wire encoding and typed errors `StripePayments` runs on (#146).
  # A runtime dependency of @thomasfosterau/effect-payments-stripe, pinned
  # EXACTLY: it is pre-1.0 and ships a new rc every week or two, so a release
  # moves only through the ordinary dependency-update flow. Its schemas are
  # generated from Stripe's 2026-07-29.dahlia spec; the wrapper pins
  # `Stripe-Version` to its own DEFAULT_API_VERSION (2025-08-27.basil) on every
  # request and decodes only the fields it maps.
  "@distilled.cloud/stripe": 1.0.0-rc.13
  # Distilled's PayPal client (same repository and licence): the operations
  # and wire encoding `PayPalPayments` runs on (#146). A runtime dependency
  # of @thomasfosterau/effect-payments-paypal, pinned EXACTLY for the same
  # reason, and moved together with the Stripe client and core. Its access
  # token comes from the wrapper's own OAuth login, never from Distilled's
  # `CredentialsFromEnv` (which reads `process.env`).
  "@distilled.cloud/paypal": 1.0.0-rc.13
  # Distilled's shared runtime, a direct dependency too: each wrapper pins its
  # `ResponseValidation` reference to lenient. MUST equal the version
  # @distilled.cloud/stripe and @distilled.cloud/paypal depend on (each pins
  # core exactly), or two copies of core install.
  "@distilled.cloud/core": 1.0.0-rc.13
  # Compiles AND RUNS every JSDoc `@example` (the `docgen` task). Exact, like
  # the Effect pin: 4.0.1 and 4.0.2 depend on `effect ^4.0.1` / `^4.0.2`,
  # which the `effect` singleton override below would contradict. Needs `tsx`
  # and a TypeScript JS API (peer `typescript <7`) — the TS6 alias below
  # satisfies it; the examples themselves type-check under the native `tsc`.
  "@effect/docgen": 4.0.0
  "@effect/language-service": ^0.87.3
  "@effect/openapi-generator": 4.0.0
  "@effect/platform-node": 4.0.0
  # Effect Language Service as a native (TypeScript-Go) binary — the TS7 side
  # of the 6/7 split. `effect-tsgo patch` overwrites the native `tsc` binary
  # with an Effect-patched build matched by gitHead, so this pins in lockstep
  # with `@typescript/native` below (0.47.2 ships against typescript 7.0.2) and
  # with the `oxlint` that `vite-plus` pulls in (0.47.2 supports oxlint 1.82.0
  # through 1.86.0 and oxlint-tsgolint 7.0.2001 / 7.0.2003; vite-plus 0.3.3
  # carries oxlint 1.83.0 and oxlint-tsgolint 7.0.2001 — 0.3.1's 1.81.0 is
  # rejected, #104).
  # Each @effect/tsgo release hard-errors (UnsupportedTargetPackageVersionError)
  # on any other component version, failing `pnpm install` itself. Read the
  # `components` table in node_modules/@effect/tsgo/dist/effect-tsgo.cjs
  # before bumping any of the three.
  "@effect/tsgo": 0.47.2
  "@mpsuesser/oxlint-plugin-effect": ^0.5.0
  "@types/node": ^26.6.4
  "@vitest/coverage-istanbul": 4.1.11
  effect: 4.0.0
  effect-solutions: ^0.5.3
  fallow: 3.31.0
  # Runs docgen's compiled examples (a peer of @effect/docgen).
  tsx: ^4.23.15
  # The official Stripe SDK: a dev dependency of
  # @thomasfosterau/effect-payments-stripe (its types describe the results of
  # the resource modules not yet migrated to generated Schema types, #81; its
  # client backs the optional SDK transport and the SDK-based webhook
  # verifier) and an OPTIONAL peer (`catalogs.peers`) — the fetch-only
  # transport (#39) never loads it. 18.5.x is the release whose API version
  # is 2025-08-27.basil, the version this package pins.
  stripe: ^18.5.0
  # TypeScript 6/7 side-by-side: TS7 (the native Go compiler) ships no JS API
  # until 7.1, so JS-API consumers (@effect/language-service, tsdown's
  # declaration bundler, @effect/docgen's peer) stay on TS6 while native `tsc`
  # type-checks. The alias keeps the package importable as `typescript`
  # name-stable at the TS6 JS compiler (bin `tsc6`); `@typescript/native` is
  # TS7 (bin `tsc`). Pinned exact: @typescript/native's gitHead must match
  # @effect/tsgo's bundled binary.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  # vite-plus pins `oxlint`, `oxfmt` and `vitest` to exact versions, so this
  # entry decides the oxlint version `effect-tsgo patch --oxlint` has to
  # support (see the @effect/tsgo note above): 0.3.0 carries oxlint 1.79.0,
  # 0.3.1 carries 1.81.0, 0.3.2 carries 1.82.0, 0.3.3 carries 1.83.0. `vite`
  # is the same release under its aliased core package, and `vitest` must
  # match vite-plus's exact pin (0.3.x → 4.1.11) because the
  # `vitest: "catalog:"` override forces every resolution to the catalog
  # singleton.
  vite-plus: 0.3.3
  vite: npm:@voidzero-dev/vite-plus-core@0.3.3
  vitest: 4.1.11

# Peer ranges the PUBLISHED packages declare. Kept as a named catalog so the
# strict catalog mode still governs them while they stay ranges (an exact
# `4.0.0-rc.118` peer would reject a consumer on rc.119). `pnpm publish`
# replaces `catalog:peers` with these ranges in the published manifest.
catalogs:
  peers:
    # rc.118 moved every `effect/unstable/<x>` module to `effect/<x>` (and
    # `httpapi` to `http-api`), so a build against rc.118 cannot load on rc.117
    # or earlier; the code is built against effect 4.0.0; the floor stays rc.118 because
    # 4.0.0 removed nothing the packages use and `>=4.0.0-rc.118` admits it.
    effect: ">=4.0.0-rc.118"
    # Optional (`peerDependenciesMeta`): only the `./Stripe` SDK transport and
    # the SDK-based `./Webhook` verifier load it, plus the resource modules
    # not yet migrated to generated types (#81) for their types. Caret, not
    # `>=`: the SDK's API version is what it sends and what those types
    # describe (18.5 → 2025-08-27.basil, the fetch transport's
    # DEFAULT_API_VERSION and the pinned OpenAPI spec of
    # packages/payments-stripe/scripts/stripe-spec.json), so a new release
    # moves all of them together.
    stripe: ^18.5.0
  # The `effect` peer range of a package that depends on Distilled
  # (@thomasfosterau/effect-payments-stripe and -paypal, #146).
  # @distilled.cloud/stripe, @distilled.cloud/paypal and @distilled.cloud/core
  # (all rc.13) declare the peer `effect: ^4.0.0`,
  # which no `4.0.0-rc.*` prerelease satisfies, and they are hard
  # dependencies, so `>=4.0.0-rc.118` would promise consumers a floor the
  # installed tree does not honour. Raise it with Distilled's own peer range;
  # the package's optional `stripe` peer stays in `peers`.
  peers-distilled:
    effect: ^4.0.0

overrides:
  vite: "catalog:"
  vitest: "catalog:"
  # `effect` MUST be a singleton (see the header): force every resolution to
  # the catalog version so a hoisting reshuffle cannot introduce a second copy.
  effect: "catalog:"
  # `@mpsuesser/oxlint-plugin-effect` (the lint plugin loaded by vite.config.ts)
  # is still built on effect beta.100 and calls `Schema.isIncludes`, which rc.118
  # renamed to `isIncluding`; the catch-all `effect` override above would force
  # it onto rc.118 and `vite.config.ts` would fail to load. Scope it to its own
  # private copy. Remove this override once the plugin ships an rc.118 build
  # (owner decision: thomasfosterau/website#2015, issuecomment-5923689409). The
  # private copy pulls in `msgpackr-extract`, already allowed in `allowBuilds`.
  "@mpsuesser/oxlint-plugin-effect>effect": 4.0.0-beta.100
nodeLinker: hoisted
allowBuilds:
  esbuild: true
  fallow: true
  msgpackr-extract: true
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

# Supply-chain delay (owner's policy, gardeneria #1149): hold newly published
# versions for 1 day (unit: MINUTES) before pnpm will install them.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # @thomasfosterau/* is first-party — exempt so our own releases install immediately.
  - "@thomasfosterau/*"
